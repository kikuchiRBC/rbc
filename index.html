{ q: "彼の理論にはいくつかの＜矛盾＞が見られる。", a: "むじゅん", ops: ["むじゅん", "ぼうじゅん", "むしょう", "ぼうしょう"] },
    ];
    let currentLevel = "N3";
    let hp = 100;
    let exp = 0;
    let lv = 1;
    let isBgmPlaying = false;

    let bossBattle = false;
    let bossStreak = 0;
    let isPotion = false;
    const bossImage = "BOSS.png";
    const clearEndings = [
        {
            img: "ending1.png",
            text: "魔王を倒して、国が平和になった。キーワード①「まおう」"
        },
        {
            img: "ending2.png",
            text: "魔王は実は行方不明だったお姫様だった。二人は結婚して幸せに暮らしました。キーワード②「は」"
        },
        {
            img: "ending3.png",
            text: "魔王を倒したが、勇者はモンエネを飲みすぎて、体調を崩した。キーワード③「おひめさま」"
        }
    ];
    const monsterImg = document.getElementById('monster-img');
    const monsterWrapper = document.getElementById('monster-wrapper');
    const audio = document.getElementById('bgm');

function getMonsterByLevel() {

    if (bossBattle) return bossImage;

    if (Math.random() < 0.05) {
        isPotion = true;   // ★追加
        return "monnene.jpg";
    }

    isPotion = false;      // ★重要

    let list;

    if (lv <= 5) list = monsters1;
    else if (lv <= 10) list = monsters2;
    else if (lv <= 15) list = monsters3;
    else list = monsters4;

    return list[Math.floor(Math.random() * list.length)];
}

    function updateStats() {

    while (exp >= 300) {
        exp -= 300;
        lv++;

        seLevel.currentTime = 0;
        seLevel.play();

        if (lv >= 20 && !bossBattle) {
            bossBattle = true;
            bossStreak = 0;

            document.getElementById('text').innerHTML =
            "<span style='color:#ff0'>★★★★ 魔王出現！ ★★★★<br>5問連続正解で勝利！</span>";

            changeMonster();
        }

        if (bossBattle && bossBgm.paused) {
            audio.pause();
            bossBgm.currentTime = 0;
            bossBgm.play();
        }
    }

    // ✅ ★これをここに入れる（超重要）
    updateMonsterBackground();

    document.getElementById('hp').innerText = hp;
    document.getElementById('exp').innerText = exp;
    document.getElementById('lv').innerText = lv;
}

//背景


    
        // 新しいモンスターを出す関数
        function changeMonster() {



    if (bossBattle) {
        monsterImg.src = bossImage;
        monsterImg.classList.add("float"); // ✅これ追加
        return;
    }

    monsterImg.style.opacity = "0";

    setTimeout(() => {

        const newMonster = getMonsterByLevel();

        monsterImg.src = newMonster;

        monsterImg.classList.remove("float");
        void monsterImg.offsetWidth; // リセット
        monsterImg.classList.add("float");

        monsterImg.style.opacity = "1";

    }, 300);
}     

function getAreaName() {

    // ★最初（ゲーム始まる前）
    if (!isBgmPlaying) return "START";

    // ★ボス
    if (bossBattle) return "Castle";

    if (lv <= 5) return "Forest";
    if (lv <= 10) return "Cave";
    if (lv <= 15) return "Abyss";
    return "Demon Realm";
}





    let currentAnswer = "";

function loadQuestion() {
document.getElementById('area-name').innerText = getAreaName();
    let list;

    // 仮（あとで増やせる）
if (currentLevel === "N3") {
    list = questions;
}
else if (currentLevel === "N2") {
    list = questions2;
}
else if (currentLevel === "N1") {
    list = questions3;
}

    const qData = list[Math.floor(Math.random() * list.length)];

    currentAnswer = qData.a;

    document.getElementById('text').innerHTML =
        `<b>【${currentLevel}問題】</b><br>${qData.q}`;

    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';

    qData.ops.sort(() => Math.random() - 0.5).forEach(op => {
        const btn = document.createElement('button');
        btn.innerText = op;
        btn.onclick = () => checkAnswer(op, qData.a);
        optionsDiv.appendChild(btn);
    });
}


function checkAnswer(selected, correct) {

    const textEl = document.getElementById('text');

    // ✅ 正解
    if (selected === correct) {

        playHitEffect();
shakeMonster();
        // ✅ モンエネ処理
        if (isPotion) {

            hp = Math.min(hp + 20, 100);

            textEl.innerHTML =
            "<span style='color:#0ff'>モンエネを飲んだ！HP回復！</span>";

            seHeal.currentTime = 0;
            seHeal.play();

            isPotion = false;

        } else {


            // ✅ ボス戦
            if (bossBattle) {

                bossStreak++;

                // ✅ 5連続でエンディング
                if (bossStreak >= 5) {

                    const ending = clearEndings[Math.floor(Math.random() * clearEndings.length)];

                    // BGM停止
                    audio.pause();
                    bossBgm.pause();

                    // エンディングBGM
                    endingBgm.currentTime = 0;
                    endingBgm.play();

                    // 画像
                    monsterImg.src = ending.img;

                    // メッセージ
                    textEl.innerHTML = `
                        <span style='color:#ff0'>
                        ★★★★★ クリア！ ★★★★★<br>
                        ${ending.text}
                        </span>`;

                    // ボタン
                    document.getElementById("options").innerHTML =
                        '<button onclick="location.reload()">もう一度遊ぶ</button>';

                    return;
                }

                // ✅ ボスダメージ表示
                textEl.innerHTML =
                `<span style='color:#ff0'>
                魔王にダメージ！<br>
                ${bossStreak}/5
                </span>`;

            } else {
                // ✅ 通常戦
                exp += 50;

                textEl.innerHTML =
                "<span style='color:#0f0'>正解！モンスター撃破！</span>";

                setTimeout(() => {
                    changeMonster();
                }, 500);
            }

            seHit.currentTime = 0;
            seHit.play();
        }

    // ❌ 不正解
    } else {

        // ✅ モンエネ逃げ
        if (isPotion) {

            textEl.innerHTML =
            "<span style='color:#0ff'>モンエネは逃げてしまった！</span>";

            isPotion = false;

            changeMonster();

            setTimeout(() => {
                loadQuestion();
            }, 800);

            return;
        }

        // ダメージ演出
        document.body.style.background = "#400";

        setTimeout(() => {
            document.body.style.background = "#000";
        }, 200);

        hp -= 20;

        if (bossBattle) {

            bossStreak = 0;

            textEl.innerHTML =
            `<span style='color:#f00'>
            魔王の反撃！<br>
            正解：${correct}
            </span>`;

        } else {

            textEl.innerHTML =
            `<span style='color:#f00'>
            ミス！20ダメージ<br>
            正解：${correct}
            </span>`;
        }

        seDamage.currentTime = 0;
        seDamage.play();

        // ✅ ゲームオーバー
        if (hp <= 0) {

            alert("目の前が真っ暗になった...");

            hp = 100;
            exp = 0;
            lv = 1;
            bossBattle = false;
            bossStreak = 0;

            changeMonster();
        }
    }

    updateStats();

    setTimeout(() => {
        loadQuestion();
    }, 1200);
}
    
    </script>
