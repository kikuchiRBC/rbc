            exp += 50;

            textEl.innerHTML =
            "<span style='color:#0f0'>正解！モンスターを倒した！</span>";
            
    seHit.currentTime = 0;
    seHit.play();


            setTimeout(() => {
                changeMonster();
            }, 500);
        }

    } else {

        document.body.style.background = "#400";

        setTimeout(() => {
            document.body.style.background = "#000";
        }, 200);

        hp -= 20;

        if (bossBattle) {

            bossStreak = 0;

            textEl.innerHTML =
            `<span style='color:#f00'>
            魔王の反撃！
            <br>
            正解：${correct}
            </span>`;

        } else {

           seDamage.currentTime = 0;
              seDamage.play();

            textEl.innerHTML =
            `<span style='color:#f00'>
            ミス！20ダメージ
            <br>
            正解：${correct}
            </span>`;
        }

        if (hp <= 0) {

            alert("目の前が真っ暗になった...");

            hp = 100;
            exp = 0;
            lv = 1;
            bossBattle = false;
            bossStreak = 0;

            changeMonster();
        }
    }

    updateStats();

    setTimeout(() => {
        loadQuestion();
    }, 1200);
}
   
</script>
</body>
</html>
