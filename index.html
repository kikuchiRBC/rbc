<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JLPT Monster Hunter: Boss Rush</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DotGothic16&display=swap');
        body { background: #000; color: #fff; font-family: 'DotGothic16', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        #game-container { width: 450px; background: #000; border: 4px solid #fff; padding: 20px; position: relative; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .stats { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 10px; border-bottom: 2px solid #fff; padding-bottom: 5px; }
        #monster-area { height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; position: relative; overflow: hidden; }
        #monster-img { height: 180px; transition: transform 0.3s, opacity 0.3s; }
        .monster-fade-in { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateY(-200px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        #message-window { height: 80px; border: 2px solid #fff; padding: 10px; margin-bottom: 15px; font-size: 1.1rem; line-height: 1.4; background: rgba(255,255,255,0.05); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { background: #000; color: #fff; border: 2px solid #fff; padding: 10px; font-family: 'DotGothic16', sans-serif; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="stats">
        <span>LV: <span id="lv">1</span></span>
        <span>HP: <span id="hp">100</span></span>
        <span>EXP: <span id="exp">0</span></span>
    </div>
    <div id="monster-area">
        <img id="monster-img" src="monster-3eyes-1024x1024.png" alt="Monster">
    </div>
    <div id="message-window">
        <div id="text">冒険が始まる！<br>モンスターを倒してレベルを上げよう！</div>
    </div>
    <div class="options-grid" id="options">
        <button onclick="startGame()">冒険をはじめる</button>
    </div>
</div>

<audio id="bgm" loop>
    <source src="maou_bgm_8bit27.mp3" type="audio/mpeg">
</audio>

<script>
    // モンスターの画像リスト
    const monsterImages = [
        "oni.png", // 鬼
        "dragon.jpg", // ドラゴン風
        "slime-c.png", // スライム風）
        "night[.png" , // 騎士風
        "monnene.jpg"  // モンエネ）
    ];

const questions  = [

  { q: "留学は楽しいこと（　　　）ではない。", a: "ばかり", ops: ["ばかり", "だけ", "ほど", "くらい"] },
  { q: "仕事に慣れる（　　　）、笑顔でお客様と話せるようになってきた。", a: "にしたがって", ops: ["にしたがって", "あいだに", "ところで", "あとで"] },
  { q: "三日間降り続けた雨が（　　　）やんだ。", a: "ようやく", ops: ["ようやく", "とつぜん", "すでに", "まもなく"] },
  { q: "インターネットで買い物をするのは、便利（　　　）怖いこともある。", a: "である一方で", ops: ["である一方で", "なので", "だから", "なら"] },
  { q: "赤ちゃんは何でも口に（　　　）たがる。", a: "入れ", ops: ["入れ", "出し", "触れ", "取り"] },
  { q: "ごめんね。約束の時間に（　　　）。", a: "間に合いそうになくて", ops: ["間に合いそうになくて", "間に合ったので", "間に合いながら", "間に合うけれど"] },
  { q: "危険！池に（　　　）。", a: "入るな", ops: ["入るな", "入ろう", "入れる", "入った"] },
  { q: "気に入ったものはつい（　　　）。", a: "買ってしまう", ops: ["買ってしまう", "買っている", "買っていた", "買わせる"] },
  { q: "よく同じ猫が来る。今日（　　　）2回見た。", a: "だけでも", ops: ["だけでも", "しか", "だけ", "ばかり"] },
  { q: "今日は晴れると言っていたので、傘を（　　　）出かけた。", a: "持たないで", ops: ["持たないで", "持つので", "持ちながら", "持とうと"] },
  { q: "受験勉強も大変だったが、大学に（　　　）もっと大変だった。", a: "入ってからの方が", ops: ["入ってからの方が", "入る前より", "入るとすぐ", "入ったばかり"] },
  { q: "いつも味噌汁のにおい（　　　）。", a: "がしてくる", ops: ["がしてくる", "をしてくる", "がなる", "をなる"] },
  { q: "この仕事は今日中に（　　　）。", a: "やってしまいたいので", ops: ["やってしまいたいので", "やっていたので", "やっているから", "やるとき"] },
    { q: "雨が降る(　　　 )、出かけません。", a: "なら", ops: ["なら", "だから", "まで", "だけ"] },
    { q: "彼は医者に( 　　　)たいと思っています。", a: "なり", ops: ["なる", "なり", "なって", "なった"] },
    { q: "この問題は私には難し( 　　　)ます。", a: "すぎ", ops: ["すぎ", "すぎる", "すぎて", "すぎだ"] },
    { q: "時間があれば映画を見に行く(　　　 )です。", a: "つもり", ops: ["つもり", "べき", "はず", "よう"] },
    { q: "彼は走る( 　　　)が速いです。", a: "の", ops: ["の", "こと", "もの", "は"] },
    { q: "日本語を勉強し( 　　　)、日本へ行きたいです。", a: "て", ops: ["て", "で", "がら", "たり"] },
    { q: "明日は雨が降るか( 　　　)分かりません。", a: "どうか", ops: ["どうか", "どう", "かどう", "なにか"] },
    { q: "このケーキは甘すぎて食べられ(　　　 )。", a: "ません", ops: ["ません", "ない", "ず", "ぬ"] },
    { q: "彼は宿題をやらない( 　　　)寝てしまった。", a: "で", ops: ["で", "に", "と", "を"] },

    { q: "駅まで歩いて10分(　　　 )かかります。", a: "ぐらい", ops: ["ぐらい", "だけ", "しか", "ほどで"] },
    { q: "忙しくて昼ご飯を食べる(　　　 )なかった。", a: "暇（ひま）も", ops: ["暇（ひま）も", "ことも", "ものも", "わけも"] },
    { q: "彼女は歌が上手(　　　 )、ダンスもできます。", a: "なだけでなく", ops: ["なだけでなく", "だけで", "しか", "くらい"] },
    { q: "この仕事は誰でもできる(　　　 )簡単です。", a: "ほど", ops: ["ほど", "くら", "のに", "だけ"] },
    { q: "これは私が作ったケーキ(　　　 )。", a: "です", ops: ["です", "だん", "でる", "します"] },
    { q: "疲れたので少し休む(　　　 )にします。", a: "こと", ops: ["こと", "もの", "の", "わけ"] },
    { q: "先生がおっしゃった( 　　　)、この問題は難しいです。", a: "とおり", ops: ["とおり", "ように", "みたい", "そう"] },
    { q: "時間になった(　　　 )、始めましょう。", a: "ので", ops: ["ので", "のに", "でも", "しか"] },
    { q: "彼は本を読み( 　　　)音楽を聞いています。", a: "ながら", ops: ["ながら", "て", "で", "たり"] },
    { q: "日本に来てから寿司を食べる( 　　　)好きになりました。", a: "のが", ops: ["のが", "こと", "ものが", "わけが"] },

    { q: "昨日買った本をまだ読んで(　　　 )。", a: "いません", ops: ["いません", "ありません", "ません", "ない"] },
    { q: "この問題は私には解ける(　　　 )ありません。", a: "わけでは", ops: ["わけでは", "では", "しか", "だけ"] },
    { q: "彼は来る(　　　 )来ないか分かりません。", a: "か", ops: ["か", "の", "で", "は"] },
    { q: "そんな危ないことはやめた(　　　 )いいです。", a: "ほうが", ops: ["ほうが", "だけが", "べきが", "ものが"] },
    { q: "もっと早く来ればよかった(　　　 )思います。", a: "と", ops: ["と", "に", "で", "を"] },
    { q: "彼は日本語が話せる( 　　　)になりました。", a: "よう", ops: ["よう", "ため", "こと", "まで"] },
    { q: "この仕事は一人でできる( 　　　)ではありません。", a: "もの", ops: ["もの", "ことが", "ため", "よう"] },
    { q: "夜遅くまで起きていた(　　　 )、寝坊しました。", a: "ので", ops: ["ので", "のに", "けど", "からで"] },
    { q: "雨なのに傘を持たないで出かけて(　　　 )。", a: "しまった", ops: ["しまった", "しまう", "しまい", "しまって"] },
    { q: "この問題は簡単(　　　 )見えますが、実は難しいです。", a: "そうに", ops: ["そうに", "ように", "みたい", "ほどに"] },
    
  { q: "ほしいけど、＜価格＞がわかりません。", a: "値段（ねだん）", ops: ["機能（きのう）", "中身（なかみ）", "値段（ねだん）", "原因（げんいん）"] },
  { q: "梅雨の時期は、雨の日が続いて＜うんざり＞する。", a: "いやになる", ops: ["不安になる", "困る", "いやになる", "腹が立つ"] },
  { q: "弟とけんかになって、＜つい＞叩いてしまった。", a: "思わず", ops: ["かなり", "思わず", "しっかり", "いきなり"] },
  { q: "箱の中に余ったおかしを＜詰めた＞。", a: "いっぱい入れた", ops: ["いっぱい入れた", "きれいに置いた", "捨てた", "片づけた"] },
  { q: "＜通勤＞には、１時間くらいかかります。", a: "仕事に行く", ops: ["学校で食べる", "学校に通う", "仕事をする", "仕事に行く"] },
  { q: "英語のレポートが＜完成＞しました。", a: "できました", ops: ["できました", "書きました", "もらいました", "説明しました"] },
  { q: "この写真を見て、＜ますます＞そこに行きたくなった。", a: "さらに", ops: ["だいぶ", "すごく", "かなり", "さらに"] },
  { q: "よく、兄と＜そっくり＞だと言われます。", a: "似ている", ops: ["似ている", "仲がいい", "合わない", "出かける"] },
  { q: "なにか、もっといい＜方法＞はありませんか。", a: "やり方", ops: ["話し方", "飲み方", "食べ方", "やり方"] },
  { q: "林さんはいつも＜勝手＞に行動するので、よく部長に注意される。", a: "許可なく", ops: ["突然", "自然に", "不まじめに", "許可なく"] }
,
  { q: "長い時間スマホを見ていたら、目が＜いたく＞なった。", a: "痛く", ops: ["病く", "痛く", "症く", "疲く"] },
  { q: "10年後の＜みらい＞は、どうなっているのでしょうか。", a: "未来", ops: ["未来", "来未", "末来", "末末"] },
  { q: "ここにある飲み物は、＜じゆう＞に飲んでいいです。", a: "自由", ops: ["自申", "白由", "自中", "自由"] },
  { q: "この店の料理は、味が＜うすい＞。", a: "薄い", ops: ["薄い", "細い", "軽い", "弱い"] },
  { q: "この書類を田中さんに（　　　）ください。", a: "渡して", ops: ["持して", "渡して", "伝して", "連して"] },
  { q: "このいすは＜かるい＞ですね。", a: "軽い", ops: ["軽い", "厚い", "短い", "重い"] },
  { q: "夜になるとカエルの＜なき＞声が聞こえる。", a: "鳴き", ops: ["烏き", "鳥き", "島き", "鳴き"] },
  { q: "久しぶりに＜うんてん＞をしました。", a: "運転", ops: ["軍軽", "運慶", "運転", "軍転"] },

];

let hp = 100;
let exp = 0;
let lv = 1;
let isBgmPlaying = false;

let bossBattle = false;
let bossStreak = 0;

const bossImage = "BOSS.png";
const monsterImg = document.getElementById('monster-img');
const audio = document.getElementById('bgm');

    function startGame() {
        if(!isBgmPlaying) { audio.play(); isBgmPlaying = true; }
        loadQuestion();
    }

    // 新しいモンスターを出す関数
    function changeMonster() {

    if (bossBattle) {
        monsterImg.src = bossImage;
        monsterImg.classList.add('monster-fade-in');
        return;
    }

    monsterImg.style.opacity = "0";

    setTimeout(() => {
        const randomImg =
            monsterImages[Math.floor(Math.random() * monsterImages.length)];

        monsterImg.src = randomImg;

        monsterImg.classList.remove('monster-fade-in');
        void monsterImg.offsetWidth;
        monsterImg.classList.add('monster-fade-in');

        monsterImg.style.opacity = "1";
    }, 300);
}

   let currentAnswer = "";

function loadQuestion() {
    const qData = questions[Math.floor(Math.random() * questions.length)];

    currentAnswer = qData.a; // ← これ追加

    document.getElementById('text').innerHTML = `<b>【問題】</b><br>${qData.q}`;
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    
    qData.ops.sort(() => Math.random() - 0.5).forEach(op => {
        const btn = document.createElement('button');
        btn.innerText = op;
        btn.onclick = () => checkAnswer(op, qData.a);
        optionsDiv.appendChild(btn);
    });
}


function checkAnswer(selected, correct) {

    const textEl = document.getElementById('text');

    // ✅ 正解
    if (selected === correct) {

        monsterImg.style.transform =
            "translateX(20px) rotate(10deg)";

        setTimeout(() => {
            monsterImg.style.transform = "translateX(0)";
        }, 100);

        if (bossBattle) {

            bossStreak++;

            textEl.innerHTML =
            `<span style='color:#ff0'>
            魔王にダメージ！
            <br>
            ${bossStreak}/5
            </span>`;

        } else {

            exp += 50;

            textEl.innerHTML =
            "<span style='color:#0f0'>正解！ ダメージを与えた！</span>";
        }

    // ✅ 不正解（←ここが重要）
    } else {

        document.body.style.background = "#400";

        setTimeout(() => {
            document.body.style.background = "#000";
        }, 200);

        hp -= 20;

        if (bossBattle) {

            bossStreak = 0;

            textEl.innerHTML =
            `<span style='color:#f00'>
            魔王の反撃！
            <br>
            正解：${correct}
            </span>`;

        } else {

            textEl.innerHTML =
            `<span style='color:#f00'>
            ミス！ 20ダメージ
            <br>
            正解：${correct}
            </span>`;
        }

        if (hp <= 0) {
            alert("目の前が真っ暗になった...");

            hp = 100;
            exp = 0;
            lv = 1;
            bossBattle = false;
            bossStreak = 0;

            changeMonster();
        }
    }

    updateStats();

    setTimeout(() => {
        loadQuestion();
    }, 1200);



    function updateStats() {
        document.getElementById('hp').innerText = hp;
        document.getElementById('exp').innerText = exp;
        document.getElementById('lv').innerText = lv;
    }}
</script>
</body>
</html>
